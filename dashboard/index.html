<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deadreckon — risk matrix</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <style>
    :root {
      --bg: #0b0d11;
      --panel: #11141c;
      --panel-2: #161a25;
      --text: #e8eaed;
      --text-dim: #9aa2b2;
      --border: #273041;
      --accent: #60a5fa;
      --pass: #22c55e;
      --pass-dim: #14532d;
      --finding: #ef4444;
      --finding-dim: #7f1d1d;
      --unknown: #f59e0b;
      --unknown-dim: #78350f;
      --low: #22c55e;
      --medium: #f59e0b;
      --high: #ef4444;
      --clock: #a855f7;
      --clock-dim: #581c87;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.35;
    }

    #app {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .loading, .error, .empty {
      margin: auto;
      text-align: center;
      max-width: 720px;
    }

    .error {
      color: var(--finding);
      background: var(--finding-dim);
      border: 1px solid var(--finding);
      border-radius: 8px;
      padding: 20px 28px;
    }

    .empty { color: var(--text-dim); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex: 0 0 auto;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand .subtitle {
      color: var(--text-dim);
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-dim);
      font-size: 15px;
      text-align: right;
    }

    .file-loader {
      position: relative;
      flex: 0 0 auto;
    }

    .file-loader input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-loader .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }

    .file-loader:hover .button,
    .file-loader:focus-within .button {
      background: #1c2130;
      border-color: var(--accent);
    }

    .view-switcher {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      gap: 4px;
    }

    .view-switcher button {
      appearance: none;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }

    .view-switcher button:hover { color: var(--text); }

    .view-switcher button.active {
      background: var(--panel-2);
      border-color: var(--accent);
      color: var(--text);
    }

    .drop-zone {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .drop-zone.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      border-radius: 12px;
    }

    .clock-banner {
      flex: 0 0 auto;
      background: var(--clock-dim);
      color: #f3e8ff;
      border: 1px solid var(--clock);
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .clock-banner .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--clock);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .legend {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text);
    }

    .matrix-wrap {
      flex: 1 1 auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th.model-col { width: 24%; }
    thead th.risk-col { width: 8%; }
    thead th.severity-col { width: 10%; }
    thead th.coverage-col { width: 8%; }

    thead th.detector {
      text-align: center;
    }

    thead th.detector .detector-id {
      display: block;
      color: var(--text);
      font-size: 15px;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 2px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 120ms ease;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    tbody tr.at-risk { box-shadow: inset 4px 0 0 var(--high); }
    tbody tr.unassessable { box-shadow: inset 4px 0 0 var(--unknown); }

    tbody td {
      padding: 18px;
      vertical-align: middle;
    }

    tbody td.model-cell {
      overflow-wrap: break-word;
      word-wrap: break-word;
      min-width: 0;
    }

    .model-name {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      text-decoration: none;
    }

    .model-name:hover { text-decoration: underline; }

    .model-group {
      display: block;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
      font-weight: 500;
    }

    .risk {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 20px;
      white-space: nowrap;
    }

    .coverage {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .coverage-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    .coverage-full {
      background: rgba(96, 165, 250, 0.15);
      color: #93c5fd;
      border-color: var(--accent);
    }

    .coverage-partial {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .coverage-unassessable {
      background: var(--unknown-dim);
      color: #fde68a;
      border-color: var(--unknown);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    .badge.severity-high { background: var(--finding-dim); color: #fecaca; border-color: var(--finding); }
    .badge.severity-medium { background: var(--unknown-dim); color: #fde68a; border-color: var(--unknown); }
    .badge.severity-low { background: var(--pass-dim); color: #bbf7d0; border-color: var(--pass); }

    .status-cell {
      text-align: center;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      min-width: 160px;
      border: 1px solid transparent;
    }

    .status .shape {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .status-pass { background: var(--pass-dim); color: #bbf7d0; border-color: var(--pass); }
    .status-pass .shape { background: var(--pass); color: #052e16; }

    .status-finding { background: var(--finding-dim); color: #fecaca; border-color: var(--finding); }
    .status-finding .shape { background: var(--finding); color: #450a0a; }

    .status-insufficient_data { background: var(--unknown-dim); color: #fde68a; border-color: var(--unknown); }
    .status-insufficient_data .shape { background: var(--unknown); color: #451a03; }

    .empty-cell {
      color: var(--text-dim);
      font-style: italic;
    }

    .upload-prompt {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      color: var(--text-dim);
      background: var(--panel);
      margin-bottom: 16px;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .drop-zone.drag-over .upload-prompt {
      border-color: var(--accent);
      background: #152033;
    }

    .upload-prompt strong { color: var(--text); }

    .ranking-wrap {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .ranking-chart {
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 20px 24px;
      position: relative;
    }

    .ranking-chart svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ranking-chart .axis-line {
      stroke: var(--border);
      stroke-width: 2;
    }

    .ranking-chart .grid-line {
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 4 4;
      opacity: 0.5;
    }

    .ranking-chart .axis-tick {
      stroke: var(--border);
      stroke-width: 1;
    }

    .ranking-chart .axis-label {
      fill: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
    }

    .ranking-chart .axis-title {
      fill: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .ranking-chart .unverified-zone {
      fill: var(--unknown-dim);
      fill-opacity: 0.18;
      stroke: var(--unknown);
      stroke-width: 1;
      stroke-dasharray: 6 4;
    }

    .ranking-chart .zone-label {
      fill: var(--unknown);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .ranking-chart .point {
      cursor: pointer;
      transition: opacity 120ms ease;
    }

    .ranking-chart .point:hover { opacity: 0.85; }

    .ranking-chart .point-marker {
      stroke-width: 2;
    }

    .ranking-chart .point-marker.safe {
      fill: var(--pass);
      stroke: var(--pass-dim);
    }

    .ranking-chart .point-marker.unassessable {
      fill: transparent;
      stroke: var(--unknown);
    }

    .ranking-chart .point-marker.at-risk {
      fill: var(--high);
      stroke: var(--finding-dim);
    }

    .ranking-chart .point-marker.finding-not-at-risk {
      fill: var(--medium);
      stroke: var(--unknown-dim);
    }

    .ranking-chart .point-icon {
      font-size: 14px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .ranking-chart .point-icon.safe { fill: #052e16; }
    .ranking-chart .point-icon.unassessable { fill: var(--unknown); }
    .ranking-chart .point-icon.at-risk { fill: #fff; }
    .ranking-chart .point-icon.finding-not-at-risk { fill: #451a03; }

    .ranking-chart .leader-line {
      stroke: var(--border);
      stroke-width: 1;
    }

    .ranking-chart .model-label-bg {
      fill: var(--panel-2);
      stroke: var(--border);
      stroke-width: 1;
      rx: 6;
    }

    .ranking-chart .model-label foreignObject {
      overflow: visible;
    }

    .ranking-chart .model-label .model-name-small {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 230px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .ranking-chart .model-label .label-risk {
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }

    .ranking-chart .model-label .label-coverage.unassessable {
      color: var(--unknown);
      font-weight: 700;
    }

    .ranking-legend {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--text-dim);
    }

    .ranking-legend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ranking-legend .legend-symbol {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .ranking-legend .legend-symbol.safe {
      background: var(--pass);
      color: #052e16;
    }

    .ranking-legend .legend-symbol.unassessable {
      background: transparent;
      border: 2px solid var(--unknown);
      color: var(--unknown);
    }

    .ranking-legend .legend-symbol.at-risk {
      background: var(--high);
      color: #fff;
    }

    .ranking-legend .legend-symbol.finding-not-at-risk {
      background: var(--medium);
      color: #451a03;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .status-cell {
      cursor: pointer;
    }

    .status-cell:hover .status {
      filter: brightness(1.15);
    }

    .status-cell:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      border-radius: 4px;
    }

    .drilldown-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      animation: fadeIn 120ms ease;
    }

    .drilldown-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
    }

    .drilldown-modal {
      position: relative;
      width: 100%;
      max-width: 920px;
      max-height: calc(100vh - 80px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 150ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drilldown-close {
      position: absolute;
      top: 16px;
      right: 16px;
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .drilldown-close:hover,
    .drilldown-close:focus {
      color: var(--text);
      border-color: var(--accent);
      outline: none;
    }

    .drilldown-header {
      flex: 0 0 auto;
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
    }

    .drilldown-model {
      font-size: 22px;
      font-weight: 800;
      word-break: break-word;
      padding-right: 48px;
    }

    .drilldown-model a {
      color: var(--accent);
      text-decoration: none;
    }

    .drilldown-model a:hover {
      text-decoration: underline;
    }

    .drilldown-meta {
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 15px;
      font-weight: 600;
    }

    .drilldown-status-wrap {
      margin-top: 12px;
    }

    .drill-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    .drill-status.status-pass { background: var(--pass-dim); color: #bbf7d0; border-color: var(--pass); }
    .drill-status.status-finding { background: var(--finding-dim); color: #fecaca; border-color: var(--finding); }
    .drill-status.status-insufficient_data { background: var(--unknown-dim); color: #fde68a; border-color: var(--unknown); }

    .drilldown-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 24px 28px;
      min-width: 0;
    }

    .pass-state {
      text-align: center;
      padding: 40px 20px;
    }

    .pass-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--pass);
      color: #052e16;
      font-size: 32px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
    }

    .pass-title {
      font-size: 24px;
      font-weight: 800;
      color: #bbf7d0;
      margin-bottom: 6px;
    }

    .pass-detail {
      color: var(--text-dim);
      font-size: 17px;
    }

    .finding-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .finding-card:last-child {
      margin-bottom: 0;
    }

    .finding-summary {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.45;
    }

    .finding-subject {
      font-size: 15px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .finding-subject a {
      color: var(--accent);
      text-decoration: none;
    }

    .finding-subject a:hover {
      text-decoration: underline;
    }

    .ignition-subgraph {
      margin: 14px 0 10px;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .subgraph-path {
      display: flex;
      align-items: stretch;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .subgraph-node {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 84px;
      max-width: 170px;
      padding: 8px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .subgraph-node.ignition {
      border-color: var(--unknown);
      background: rgba(245, 158, 11, 0.1);
      box-shadow: inset 0 0 0 1px var(--unknown-dim);
    }

    .subgraph-node a {
      color: var(--accent);
      text-decoration: underline;
    }

    .subgraph-node a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .node-type {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .node-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.3;
    }

    .subgraph-node.ignition .node-name {
      color: #fde68a;
    }

    .ignition-annotation {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--unknown-dim);
      font-size: 12px;
      font-weight: 600;
      color: var(--unknown);
      line-height: 1.3;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .subgraph-arrow {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--text-dim);
      font-size: 18px;
      font-weight: 700;
      padding: 0 2px;
    }

    .full-lineage-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .full-lineage-link:hover {
      text-decoration: underline;
    }

    .meta-label {
      color: var(--text-dim);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        return d.toISOString().replace("T", " ").slice(0, 19) + " UTC";
      } catch {
        return String(iso);
      }
    }

    function validateRun(data) {
      if (!data || typeof data !== "object") {
        throw new Error("Uploaded file is not a JSON object.");
      }
      if (typeof data.schema_version !== "string") {
        throw new Error("Missing schema_version field.");
      }
      const major = data.schema_version.split(".")[0];
      if (major !== "1") {
        throw new Error(`Unsupported schema version: ${escapeHtml(data.schema_version)}. Expected major version 1.`);
      }
      if (!data.run || typeof data.run !== "object") {
        throw new Error("Missing run metadata.");
      }
      if (!Array.isArray(data.models)) {
        throw new Error("Missing models array.");
      }
      if (!data.detectors_meta || typeof data.detectors_meta !== "object") {
        throw new Error("Missing detectors_meta.");
      }
      if (!data.scoring || typeof data.scoring !== "object") {
        throw new Error("Missing scoring metadata.");
      }
    }

    function loadRun(data) {
      validateRun(data);
      currentRun = data;
      loadError = null;
      render();
    }

    function setError(message) {
      loadError = message;
      render();
    }

    function readFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          loadRun(parsed);
        } catch (err) {
          setError(`Could not parse ${escapeHtml(file.name)}: ${err.message}`);
        }
      };
      reader.onerror = () => setError(`Could not read ${escapeHtml(file.name)}.`);
      reader.readAsText(file);
    }

    function loadDefault() {
      loadRun(EMBEDDED_DEFAULT_RUN);
    }

    function setView(view) {
      currentView = view;
      closeDrilldown();
      render();

    function buildLineageUrlMap(lineagePath) {
      const map = {};
      if (Array.isArray(lineagePath)) {
        lineagePath.forEach((node) => {
          if (node && node.urn != null) {
            map[node.urn] = node.url || null;
          }
        });
      }
      return map;
    }

    function urnLink(urn, lineageMap) {
      const url = lineageMap && lineageMap[urn];
      if (url) {
        return `<a class="urn-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(urn)}</a>`;
      }
      return `<code class="urn-text">${escapeHtml(urn)}</code>`;
    }

    function renderEvidenceRows(detector, evidence, lineageMap) {
      const e = evidence || {};
      const rows = [];
      if (detector === "D1") {
        rows.push({ label: "Frozen source", html: urnLink(e.dataset_urn, lineageMap) });
        rows.push({ label: "Last real update", html: escapeHtml(formatDate(e.dataset_last_updated)) });
        rows.push({ label: "Frozen for", html: `${escapeHtml(e.frozen_days)} days` });
        rows.push({ label: "Latest training run", html: escapeHtml(formatDate(e.latest_training_run_at)) });
      } else if (detector === "D2") {
        rows.push({ label: "Feature", html: urnLink(e.feature_urn, lineageMap) });
        const source = e.source_column
          ? `${escapeHtml(e.source_column)}, on dataset ${urnLink(e.dataset_urn, lineageMap)}`
          : urnLink(e.dataset_urn, lineageMap);
        rows.push({ label: "Source column", html: source });
        rows.push({ label: "Schema changed", html: escapeHtml(formatDate(e.schema_changed_at)) });
        rows.push({ label: "Missing for", html: `${escapeHtml(e.missing_days)} days` });
        rows.push({ label: "Latest training run", html: escapeHtml(formatDate(e.latest_training_run_at)) });
      } else if (detector === "D3") {
        rows.push({ label: "Transformation", html: urnLink(e.transformation_dataset_urn, lineageMap) });
        rows.push({ label: "Feature source", html: urnLink(e.feature_source_dataset_urn, lineageMap) });
        rows.push({ label: "Definition changed", html: escapeHtml(formatDate(e.definition_changed_at)) });
        rows.push({ label: "Changed", html: `${escapeHtml(e.changed_days)} days ago` });
        rows.push({ label: "Latest training run", html: escapeHtml(formatDate(e.latest_training_run_at)) });
      } else {
        for (const [key, value] of Object.entries(e)) {
          rows.push({ label: key, html: escapeHtml(value) });
        }
      }
      return rows;
    }

    function renderCausalAnnotation(detector, evidence) {
      const e = evidence || {};
      if (detector === "D1") {
        return `Frozen ${escapeHtml(e.frozen_days != null ? e.frozen_days : "?")} day(s) — training kept running`;
      } else if (detector === "D2") {
        return `${escapeHtml(e.source_column != null ? e.source_column : "?")} missing ${escapeHtml(e.missing_days != null ? e.missing_days : "?")} day(s) before last training`;
      } else if (detector === "D3") {
        return `Definition changed ${escapeHtml(e.changed_days != null ? e.changed_days : "?")} day(s) before last training`;
      }
      return "";
    }

    function lineageTypeLabel(type) {
      const map = {
        dataset: "Dataset",
        mlFeature: "Feature",
        dataProcessInstance: "Run",
        mlModel: "Model",
      };
      return map[type] || (type ? escapeHtml(String(type)) : "Node");
    }

    function renderIgnition(lineagePath, detector, evidence, modelUrl) {
      if (!Array.isArray(lineagePath) || lineagePath.length === 0) return "";

      const nodesHtml = lineagePath.map((node, index) => {
        const isIgnition = node && node.ignition === true;
        const chipClass = isIgnition ? "subgraph-node ignition" : "subgraph-node";
        const typeLabel = lineageTypeLabel(node && node.type);
        const name = escapeHtml(node.name || node.urn || "Unknown");
        const nameHtml = node.url
          ? `<a class="node-name" href="${escapeHtml(node.url)}" target="_blank" rel="noopener" title="${name}">${name}</a>`
          : `<span class="node-name" title="${name}">${name}</span>`;
        const annotation = isIgnition
          ? `<span class="ignition-annotation">${escapeHtml(renderCausalAnnotation(detector, evidence))}</span>`
          : "";
        const arrow = index > 0 ? `<span class="subgraph-arrow" aria-hidden="true">→</span>` : "";
        return `${arrow}<div class="${chipClass}"><span class="node-type">${typeLabel}</span>${nameHtml}${annotation}</div>`;
      }).join("");

      const lineageLink = modelUrl
        ? `<a class="full-lineage-link" href="${escapeHtml(modelUrl)}" target="_blank" rel="noopener">Open full lineage in DataHub <span aria-hidden="true">→</span></a>`
        : "";

      return `
        <div class="ignition-subgraph">
          <div class="subgraph-path">${nodesHtml}</div>
          ${lineageLink}
        </div>
      `;
    }

    function closeDrilldown() {

          const subjectsHtml = subjects.map((s) => {
            const urnText = escapeHtml(s.urn || "");

        bodyHtml = findings.map((finding) => {
          const lineageMap = buildLineageUrlMap(finding.lineage_path);
          const subjectText = escapeHtml(finding.subject || finding.subject_urn || "");

          coverageBadgeClass = "coverage-badge coverage-full";
        }
        const coverageCell = `<span class="${coverageBadgeClass}">${escapeHtml(coverage.label || "—")}</span>`;

        const detectorCells = detectors.map((d) => {
          const detector = model.detectors && model.detectors[d];
          if (!detector) {
            return `<td class="status-cell empty-cell">—</td>`;
          }
          const detectorTitle = escapeHtml((meta[d] && meta[d].title) || d);
          return `<td class="status-cell" role="button" tabindex="0" aria-label="Open ${detectorTitle} drilldown for ${escapeHtml(model.name || "Unnamed model")}" data-model-urn="${escapeHtml(model.urn)}" data-detector="${escapeHtml(d)}">${renderStatusCell(detector.status)}</td>`;
        }).join("");

        return `
          <tr class="${rowClass}">
            <td class="model-cell">${nameCell}${group}</td>
            <td class="risk">risk=${scoreVal}/${maxVal}</td>
            <td>${renderSeverityBadge(model.severity)}</td>
            <td class="coverage">${coverageCell}</td>
            ${detectorCells}
          </tr>
        `;
      }).join("");

      return `
        <div class="matrix-wrap">
          <table role="table" aria-label="Model risk matrix">
            <thead>
              <tr>
                <th class="model-col" scope="col">Model</th>
                <th class="risk-col" scope="col">Risk</th>
                <th class="severity-col" scope="col">Severity</th>
                <th class="coverage-col" scope="col">Coverage</th>
                ${headerCols}
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="${4 + detectors.length}" class="empty-cell">No models in this run.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderLegend() {
      const run = currentRun;
      if (!run) return "";

      const statuses = Array.isArray(run.scoring && run.scoring.statuses) ? run.scoring.statuses : Object.keys(STATUS_CONFIG);
      const statusChips = statuses.map((s) => {
        const cfg = STATUS_CONFIG[s];
        if (!cfg) return "";
        return `<span class="chip ${cfg.class}"><span aria-hidden="true">${cfg.shape}</span>${escapeHtml(cfg.label)}</span>`;
      }).join("");

      const thresholds = run.scoring && run.scoring.severity_thresholds;
      let thresholdText = "";
      if (thresholds && typeof thresholds === "object") {
        const parts = [];
        if (typeof thresholds.HIGH === "number") parts.push(`HIGH ≥ ${thresholds.HIGH}`);
        if (typeof thresholds.MEDIUM === "number") parts.push(`MEDIUM ≥ ${thresholds.MEDIUM}`);
        if (parts.length) thresholdText = ` — thresholds: ${parts.join(", ")}`;
      }

      return `
        <div class="legend">
          <div class="legend-group">
            <span>Detector states:</span>
            ${statusChips}
          </div>
          <div class="legend-group">
            <span>Severity${thresholdText}</span>
            <span class="chip severity-high">▲ HIGH</span>
            <span class="chip severity-medium">◆ MEDIUM</span>
            <span class="chip severity-low">● LOW</span>
          </div>
        </div>
      `;
    }

    function renderClockBanner() {
      const run = currentRun;
      if (!run || !run.run || !run.run.clock_overridden) return "";
      const assessed = formatDate(run.run.assessed_at);
      return `
        <div class="clock-banner" role="status">
          <span class="icon" aria-hidden="true">⏱</span>
          <span>This run's clock was overridden for testing — effective date: ${escapeHtml(assessed)}</span>
        </div>
      `;
    }

    function renderViewSwitcher() {
      const matrixClass = currentView === "matrix" ? "active" : "";
      const rankingClass = currentView === "ranking" ? "active" : "";
      return `
        <div class="view-switcher" role="tablist" aria-label="Dashboard view">
          <button type="button" role="tab" aria-selected="${currentView === "matrix"}" class="${matrixClass}" data-view="matrix">Matrix</button>
          <button type="button" role="tab" aria-selected="${currentView === "ranking"}" class="${rankingClass}" data-view="ranking">Ranking & Coverage</button>
        </div>
      `;
    }

    function renderHeader() {
      const run = currentRun;
      const assessed = run && run.run ? formatDate(run.run.assessed_at) : "—";
      const modelCount = run && Array.isArray(run.models) ? run.models.length : 0;
      const subtitle = currentView === "matrix"
        ? "Risk matrix · view 4.1"
        : "Ranking & coverage · view 4.2";

      return `
        <header>
          <div class="brand">
            <h1>deadreckon</h1>
            <span class="subtitle">${subtitle}</span>
          </div>
          <div class="meta">
            <span>${modelCount} model${modelCount === 1 ? "" : "s"} · ${assessed}</span>
            ${renderViewSwitcher()}
            <label class="file-loader">
              <input type="file" accept=".json,application/json" aria-label="Load run JSON file" />
              <span class="button">📁 Load run JSON</span>
            </label>
          </div>
        </header>
      `;
    }

    function renderUploadPrompt() {
      return `
        <div class="upload-prompt">
          <strong>Drag and drop a run JSON file here</strong>, or use the file picker above.
        </div>
      `;
    }

    function getModelCategory(model) {
      if (model.tags && model.tags.unassessable === true) return "unassessable";
      if (model.tags && model.tags.at_risk === true) return "at-risk";
      if (model.finding_count > 0) return "finding-not-at-risk";
      return "safe";
    }

    function renderRankingChart() {
      const run = currentRun;
      if (!run) return "";

      const models = run.models || [];
      const scoring = run.scoring || {};
      const maxScore = typeof scoring.max_possible_score === "number" && Number.isFinite(scoring.max_possible_score)
        ? scoring.max_possible_score
        : 3;

      const totalCoverage = models.length && models[0].coverage && typeof models[0].coverage.total === "number"
        ? models[0].coverage.total
        : 3;

      const width = 1100;
      const height = 620;
      const margin = { top: 40, right: 300, bottom: 70, left: 70 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;

      const xPad = plotW * 0.05;
      const yPad = plotH * 0.05;
      const x0 = margin.left + xPad;
      const x1 = margin.left + plotW - xPad;
      const y0 = margin.top + plotH - yPad;
      const y1 = margin.top + yPad;

      function xScale(score) {
        const t = maxScore > 0 ? Math.min(Math.max(score, 0) / maxScore, 1) : 0;
        return x0 + t * (x1 - x0);
      }

      function yScale(conclusive) {
        const t = totalCoverage > 0 ? Math.min(Math.max(conclusive, 0) / totalCoverage, 1) : 0;
        return y0 - t * (y0 - y1);
      }

      const xTicks = 5;
      let xAxisTicks = "";
      for (let i = 0; i <= xTicks; i++) {
        const value = (maxScore / xTicks) * i;
        const x = xScale(value);
        xAxisTicks += `
          <line class="axis-tick" x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + 6}" />
          <line class="grid-line" x1="${x}" y1="${y1}" x2="${x}" y2="${y0}" />
          <text class="axis-label" x="${x}" y="${y0 + 24}" text-anchor="middle">${value.toFixed(1)}</text>
        `;
      }

      let yAxisTicks = "";
      for (let i = 0; i <= totalCoverage; i++) {
        const y = yScale(i);
        yAxisTicks += `
          <line class="axis-tick" x1="${margin.left - 6}" y1="${y}" x2="${margin.left}" y2="${y}" />
          <line class="grid-line" x1="${margin.left}" y1="${y}" x2="${margin.left + plotW}" y2="${y}" />
          <text class="axis-label" x="${margin.left - 12}" y="${y + 4}" text-anchor="end">${i}/${totalCoverage}</text>
        `;
      }

      const zoneTop = yScale(0.5);
      const zoneLabelY = zoneTop + 18;
      const zoneLabelX = margin.left + plotW - 14;

      const LABEL_W = 240;
      const LABEL_H = 48;
      const LABEL_GAP = 8;
      const LABEL_COLLISION_THRESHOLD = 50;

      const placedPoints = [];
      const placedLabels = [];

      function rectOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function labelRect(labelX, labelY) {
        return { x: labelX - 6, y: labelY - 4, w: LABEL_W + 12, h: LABEL_H + 8 };
      }

      function inBounds(rect) {
        return rect.x >= 0 && rect.x + rect.w <= width && rect.y >= 0 && rect.y + rect.h <= height;
      }

      function placeLabel(cx, cy, index) {
        const baseAbove = index % 2 === 0;

        let extraOffset = 0;
        for (const p of placedPoints) {
          const dx = cx - p.x;
          const dy = cy - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < LABEL_COLLISION_THRESHOLD) {
            extraOffset = Math.max(extraOffset, LABEL_COLLISION_THRESHOLD - dist);
          }
        }

        function tryPlacement(above, additionalOffset) {
          const labelX = cx + 22;
          const vGap = LABEL_GAP + additionalOffset;
          const labelY = above ? cy - LABEL_H - vGap : cy + vGap;
          const rect = labelRect(labelX, labelY);
          if (!inBounds(rect)) return null;
          if (placedLabels.some((r) => rectOverlap(rect, r))) return null;
          return { labelX, labelY, above, rect };
        }

        let placement = tryPlacement(baseAbove, extraOffset);
        if (!placement) placement = tryPlacement(!baseAbove, extraOffset);
        for (let step = 1; !placement && step < 6; step++) {
          const additionalOffset = extraOffset + step * (LABEL_H + LABEL_GAP);
          placement = tryPlacement(baseAbove, additionalOffset);
          if (!placement) placement = tryPlacement(!baseAbove, additionalOffset);
        }

        if (!placement) {
          const labelX = cx + 22;
          const vGap = LABEL_GAP + extraOffset;
          const labelY = baseAbove ? cy - LABEL_H - vGap : cy + vGap;
          placement = { labelX, labelY, above: baseAbove, rect: labelRect(labelX, labelY) };
        }

        placedPoints.push({ x: cx, y: cy });
        placedLabels.push(placement.rect);
        return placement;
      }

      const points = models.map((model, index) => {
        const score = typeof model.score === "number" ? model.score : 0;
        const conclusive = model.coverage && typeof model.coverage.conclusive === "number"
          ? model.coverage.conclusive
          : 0;
        const coverageLabel = (model.coverage && model.coverage.label) || `${conclusive}/${totalCoverage}`;
        const category = getModelCategory(model);

        const cx = xScale(score);
        const cy = yScale(conclusive);

        const name = escapeHtml(model.name || "Unnamed model");
        const scoreVal = score.toFixed(1);
        const maxVal = maxScore.toFixed(1);
        const riskText = `risk=${scoreVal}/${maxVal}`;
        const coverageClass = category === "unassessable" ? "label-coverage unassessable" : "label-coverage";

        const placement = placeLabel(cx, cy, index);
        const labelX = placement.labelX;
        const labelY = placement.labelY;
        const labelAbove = placement.above;

        let icon = "";
        if (category === "safe") icon = "✓";
        else if (category === "unassessable") icon = "?";
        else if (category === "at-risk") icon = "✕";
        else icon = "!";

        const leaderStartX = cx + 10;
        const leaderStartY = labelAbove ? cy - 10 : cy + 10;
        const leaderEndX = labelX - 6;
        const leaderEndY = labelAbove ? labelY + LABEL_H - 8 : labelY + 8;

        return `
          <g class="point" data-category="${category}">
            <circle class="point-marker ${category}" cx="${cx}" cy="${cy}" r="10" />
            <text class="point-icon ${category}" x="${cx}" y="${cy}" dominant-baseline="central">${icon}</text>
            <line class="leader-line" x1="${leaderStartX}" y1="${leaderStartY}" x2="${leaderEndX}" y2="${leaderEndY}" />
            <rect class="model-label-bg" x="${labelX - 6}" y="${labelY - 4}" width="${LABEL_W + 12}" height="${LABEL_H + 8}" />
            <foreignObject class="model-label" x="${labelX}" y="${labelY}" width="${LABEL_W}" height="${LABEL_H}">
              <div xmlns="http://www.w3.org/1999/xhtml">
                <div class="model-name-small" title="${name}">${name}</div>
                <div class="label-risk">${riskText} · <span class="${coverageClass}">${escapeHtml(coverageLabel)}</span></div>
              </div>
            </foreignObject>
          </g>
        `;
      }).join("");

      return `
        <div class="ranking-chart" role="img" aria-label="Risk versus coverage scatter plot">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
            <rect class="unverified-zone" x="${margin.left}" y="${zoneTop}" width="${plotW}" height="${y0 - zoneTop}" />

            ${xAxisTicks}
            ${yAxisTicks}

            <line class="axis-line" x1="${margin.left}" y1="${y0}" x2="${margin.left + plotW}" y2="${y0}" />
            <line class="axis-line" x1="${margin.left}" y1="${y0}" x2="${margin.left}" y2="${margin.top}" />

            <text class="axis-title" x="${margin.left + plotW / 2}" y="${height - 18}" text-anchor="middle">Risk score →</text>
            <text class="axis-title" x="${18}" y="${margin.top + plotH / 2}" text-anchor="middle" transform="rotate(-90, 18, ${margin.top + plotH / 2})">Coverage (conclusive detectors) →</text>

            ${points}

            <text class="zone-label" x="${zoneLabelX}" y="${zoneLabelY}" text-anchor="end">⚠ Unverified — not the same as safe</text>
          </svg>
        </div>
      `;
    }

    function renderRankingLegend() {
      return `
        <div class="ranking-legend">
          <span class="legend-item"><span class="legend-symbol safe" aria-hidden="true">✓</span> Fully checked, clean</span>
          <span class="legend-item"><span class="legend-symbol at-risk" aria-hidden="true">✕</span> At risk</span>
          <span class="legend-item"><span class="legend-symbol finding-not-at-risk" aria-hidden="true">!</span> Finding but not at risk</span>
          <span class="legend-item"><span class="legend-symbol unassessable" aria-hidden="true">?</span> Unassessable (0 checked)</span>
        </div>
      `;
    }

    function renderRanking() {
      const run = currentRun;
      if (!run) return "";

      return `
        <div class="ranking-wrap">
          ${renderRankingChart()}
          ${renderRankingLegend()}
        </div>
      `;
    }

    function renderMainContent() {
      if (currentView === "matrix") {
        return `${renderLegend()}${renderMatrix()}`;
      }
      return renderRanking();
    }

    function render() {
      closeDrilldown();
      if (!currentRun && !loadError) {
        app.innerHTML = `<div class="loading">Loading run data…</div>`;
        return;
      }

      if (loadError && !currentRun) {
        app.innerHTML = `
          ${renderHeader()}
          <div class="drop-zone">
            <div class="error">${loadError}</div>
            ${renderUploadPrompt()}
          </div>
        `;
        bindEvents();
        return;
      }

      app.innerHTML = `
        ${renderHeader()}
        <div class="drop-zone">
          ${renderClockBanner()}
          ${renderMainContent()}
          ${renderUploadPrompt()}
        </div>
      `;
      bindEvents();
    }

    function bindEvents() {
      const input = app.querySelector('input[type="file"]');
      if (input) {
        input.addEventListener("change", (e) => readFile(e.target.files[0]));
      }

      const buttons = app.querySelectorAll(".view-switcher button[data-view]");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => setView(btn.dataset.view));
      });

      const dropZone = app.querySelector(".drop-zone");
      if (dropZone) {
        ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
          dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
          }, false);
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          dropZone.addEventListener(eventName, () => dropZone.classList.add("drag-over"), false);
        });

        ["dragleave", "drop"].forEach((eventName) => {
          dropZone.addEventListener(eventName, () => dropZone.classList.remove("drag-over"), false);
        });

        dropZone.addEventListener("drop", (e) => {
          const file = e.dataTransfer.files[0];
          if (file) readFile(file);
        }, false);
      }

      const cells = app.querySelectorAll(".status-cell[data-model-urn]");
      cells.forEach((cell) => {
        cell.addEventListener("click", () => openDrilldown(cell.dataset.modelUrn, cell.dataset.detector));
        cell.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openDrilldown(cell.dataset.modelUrn, cell.dataset.detector);
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      render();
      loadDefault();
    });
  </script>
</body>
</html>
