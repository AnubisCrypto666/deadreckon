<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deadreckon — risk matrix</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <style>
    :root {
      --bg: #0b0d11;
      --panel: #11141c;
      --panel-2: #161a25;
      --text: #e8eaed;
      --text-dim: #9aa2b2;
      --border: #273041;
      --accent: #60a5fa;
      --pass: #22c55e;
      --pass-dim: #14532d;
      --finding: #ef4444;
      --finding-dim: #7f1d1d;
      --unknown: #f59e0b;
      --unknown-dim: #78350f;
      --low: #22c55e;
      --medium: #f59e0b;
      --high: #ef4444;
      --clock: #a855f7;
      --clock-dim: #581c87;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.35;
    }

    #app {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
    }

    .loading, .error, .empty {
      margin: auto;
      text-align: center;
      max-width: 720px;
    }

    .error {
      color: var(--finding);
      background: var(--finding-dim);
      border: 1px solid var(--finding);
      border-radius: 8px;
      padding: 20px 28px;
    }

    .empty { color: var(--text-dim); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex: 0 0 auto;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand .subtitle {
      color: var(--text-dim);
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-dim);
      font-size: 15px;
      text-align: right;
    }

    .file-loader {
      position: relative;
      flex: 0 0 auto;
    }

    .file-loader input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-loader .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }

    .file-loader:hover .button,
    .file-loader:focus-within .button {
      background: #1c2130;
      border-color: var(--accent);
    }

    .view-switcher {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      gap: 4px;
    }

    .view-switcher button {
      appearance: none;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }

    .view-switcher button:hover { color: var(--text); }

    .view-switcher button.active {
      background: var(--panel-2);
      border-color: var(--accent);
      color: var(--text);
    }

    .drop-zone {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .drop-zone.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      border-radius: 12px;
    }

    .clock-banner {
      flex: 0 0 auto;
      background: var(--clock-dim);
      color: #f3e8ff;
      border: 1px solid var(--clock);
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .clock-banner .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--clock);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .legend {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text);
    }

    .matrix-wrap {
      flex: 1 1 auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead th.model-col { width: 24%; }
    thead th.risk-col { width: 8%; }
    thead th.severity-col { width: 10%; }
    thead th.coverage-col { width: 8%; }

    thead th.detector {
      text-align: center;
    }

    thead th.detector .detector-id {
      display: block;
      color: var(--text);
      font-size: 15px;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 2px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 120ms ease;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    tbody tr.at-risk { box-shadow: inset 4px 0 0 var(--high); }
    tbody tr.unassessable { box-shadow: inset 4px 0 0 var(--unknown); }

    tbody td {
      padding: 18px;
      vertical-align: middle;
    }

    tbody td.model-cell {
      overflow-wrap: break-word;
      word-wrap: break-word;
      min-width: 0;
    }

    .model-name {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      text-decoration: none;
    }

    .model-name:hover { text-decoration: underline; }

    .model-group {
      display: block;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
      font-weight: 500;
    }

    .risk {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 20px;
      white-space: nowrap;
    }

    .coverage {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 18px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .coverage.unassessable { color: var(--unknown); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    .badge.severity-high { background: var(--finding-dim); color: #fecaca; border-color: var(--finding); }
    .badge.severity-medium { background: var(--unknown-dim); color: #fde68a; border-color: var(--unknown); }
    .badge.severity-low { background: var(--pass-dim); color: #bbf7d0; border-color: var(--pass); }

    .status-cell {
      text-align: center;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      min-width: 160px;
      border: 1px solid transparent;
    }

    .status .shape {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .status-pass { background: var(--pass-dim); color: #bbf7d0; border-color: var(--pass); }
    .status-pass .shape { background: var(--pass); color: #052e16; }

    .status-finding { background: var(--finding-dim); color: #fecaca; border-color: var(--finding); }
    .status-finding .shape { background: var(--finding); color: #450a0a; }

    .status-insufficient_data { background: var(--unknown-dim); color: #fde68a; border-color: var(--unknown); }
    .status-insufficient_data .shape { background: var(--unknown); color: #451a03; }

    .empty-cell {
      color: var(--text-dim);
      font-style: italic;
    }

    .upload-prompt {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      color: var(--text-dim);
      background: var(--panel);
      margin-bottom: 16px;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .drop-zone.drag-over .upload-prompt {
      border-color: var(--accent);
      background: #152033;
    }

    .upload-prompt strong { color: var(--text); }

    .ranking-wrap {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .ranking-chart {
      flex: 1 1 auto;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 20px 24px;
      position: relative;
    }

    .ranking-chart svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ranking-chart .axis-line {
      stroke: var(--border);
      stroke-width: 2;
    }

    .ranking-chart .grid-line {
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 4 4;
      opacity: 0.5;
    }

    .ranking-chart .axis-tick {
      stroke: var(--border);
      stroke-width: 1;
    }

    .ranking-chart .axis-label {
      fill: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
    }

    .ranking-chart .axis-title {
      fill: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .ranking-chart .unverified-zone {
      fill: var(--unknown-dim);
      fill-opacity: 0.18;
      stroke: var(--unknown);
      stroke-width: 1;
      stroke-dasharray: 6 4;
    }

    .ranking-chart .zone-label {
      fill: var(--unknown);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .ranking-chart .point {
      cursor: pointer;
      transition: opacity 120ms ease;
    }

    .ranking-chart .point:hover { opacity: 0.85; }

    .ranking-chart .point-marker {
      stroke-width: 2;
    }

    .ranking-chart .point-marker.safe {
      fill: var(--pass);
      stroke: var(--pass-dim);
    }

    .ranking-chart .point-marker.unassessable {
      fill: transparent;
      stroke: var(--unknown);
    }

    .ranking-chart .point-marker.at-risk {
      fill: var(--high);
      stroke: var(--finding-dim);
    }

    .ranking-chart .point-marker.finding-not-at-risk {
      fill: var(--medium);
      stroke: var(--unknown-dim);
    }

    .ranking-chart .point-icon {
      font-size: 14px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .ranking-chart .point-icon.safe { fill: #052e16; }
    .ranking-chart .point-icon.unassessable { fill: var(--unknown); }
    .ranking-chart .point-icon.at-risk { fill: #fff; }
    .ranking-chart .point-icon.finding-not-at-risk { fill: #451a03; }

    .ranking-chart .leader-line {
      stroke: var(--border);
      stroke-width: 1;
    }

    .ranking-chart .model-label-bg {
      fill: var(--panel-2);
      stroke: var(--border);
      stroke-width: 1;
      rx: 6;
    }

    .ranking-chart .model-label foreignObject {
      overflow: visible;
    }

    .ranking-chart .model-label .model-name-small {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 230px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .ranking-chart .model-label .label-risk {
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }

    .ranking-chart .model-label .label-coverage.unassessable {
      color: var(--unknown);
      font-weight: 700;
    }

    .ranking-legend {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--text-dim);
    }

    .ranking-legend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ranking-legend .legend-symbol {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .ranking-legend .legend-symbol.safe {
      background: var(--pass);
      color: #052e16;
    }

    .ranking-legend .legend-symbol.unassessable {
      background: transparent;
      border: 2px solid var(--unknown);
      color: var(--unknown);
    }

    .ranking-legend .legend-symbol.at-risk {
      background: var(--high);
      color: #fff;
    }

    .ranking-legend .legend-symbol.finding-not-at-risk {
      background: var(--medium);
      color: #451a03;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    "use strict";

    const DEFAULT_RUN_URL = "../examples/sample-run.json";

    const STATUS_CONFIG = {
      PASS: { label: "PASS", shape: "✓", class: "status-pass" },
      FINDING: { label: "FINDING", shape: "✕", class: "status-finding" },
      INSUFFICIENT_DATA: { label: "INSUFFICIENT DATA", shape: "?", class: "status-insufficient_data" },
    };

    const app = document.getElementById("app");
    let currentRun = null;
    let loadError = null;
    let currentView = "matrix";

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        return d.toISOString().replace("T", " ").slice(0, 19) + " UTC";
      } catch {
        return String(iso);
      }
    }

    function validateRun(data) {
      if (!data || typeof data !== "object") {
        throw new Error("Uploaded file is not a JSON object.");
      }
      if (typeof data.schema_version !== "string") {
        throw new Error("Missing schema_version field.");
      }
      const major = data.schema_version.split(".")[0];
      if (major !== "1") {
        throw new Error(`Unsupported schema version: ${escapeHtml(data.schema_version)}. Expected major version 1.`);
      }
      if (!data.run || typeof data.run !== "object") {
        throw new Error("Missing run metadata.");
      }
      if (!Array.isArray(data.models)) {
        throw new Error("Missing models array.");
      }
      if (!data.detectors_meta || typeof data.detectors_meta !== "object") {
        throw new Error("Missing detectors_meta.");
      }
      if (!data.scoring || typeof data.scoring !== "object") {
        throw new Error("Missing scoring metadata.");
      }
    }

    function loadRun(data) {
      validateRun(data);
      currentRun = data;
      loadError = null;
      render();
    }

    function setError(message) {
      loadError = message;
      render();
    }

    function readFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          loadRun(parsed);
        } catch (err) {
          setError(`Could not parse ${escapeHtml(file.name)}: ${err.message}`);
        }
      };
      reader.onerror = () => setError(`Could not read ${escapeHtml(file.name)}.`);
      reader.readAsText(file);
    }

    async function loadDefault() {
      try {
        const response = await fetch(DEFAULT_RUN_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        loadRun(data);
      } catch (err) {
        loadError = `Default run could not be loaded automatically (${err.message}). Drop a run JSON file below, or use the file picker.`;
        currentRun = null;
        render();
      }
    }

    function setView(view) {
      currentView = view;
      render();
    }

    function renderStatusCell(status) {
      const cfg = STATUS_CONFIG[status];
      if (!cfg) {
        return `<div class="status" title="Unknown status"><span class="shape">!</span>${escapeHtml(status || "UNKNOWN")}</div>`;
      }
      return `<div class="status ${cfg.class}"><span class="shape" aria-hidden="true">${cfg.shape}</span>${cfg.label}</div>`;
    }

    function renderSeverityBadge(severity) {
      const sev = String(severity || "").toUpperCase();
      const map = {
        HIGH: { cls: "severity-high", icon: "▲" },
        MEDIUM: { cls: "severity-medium", icon: "◆" },
        LOW: { cls: "severity-low", icon: "●" },
      };
      const cfg = map[sev] || { cls: "severity-low", icon: "●" };
      return `<span class="badge ${cfg.cls}"><span aria-hidden="true">${cfg.icon}</span>${escapeHtml(sev)}</span>`;
    }

    function renderMatrix() {
      const run = currentRun;
      if (!run) return "";

      const detectors = Array.isArray(run.run.detectors) ? run.run.detectors : [];
      const meta = run.detectors_meta || {};
      const scoring = run.scoring || {};
      const maxScore = typeof scoring.max_possible_score === "number" ? scoring.max_possible_score : 3;

      const headerCols = detectors.map((d) => {
        const title = (meta[d] && meta[d].title) || d;
        return `<th class="detector" scope="col">${escapeHtml(d)}<span class="detector-id">${escapeHtml(title)}</span></th>`;
      }).join("");

      const rows = run.models.map((model) => {
        const name = escapeHtml(model.name || "Unnamed model");
        const nameCell = model.url
          ? `<a class="model-name" href="${escapeHtml(model.url)}" target="_blank" rel="noopener" title="${name}">${name}</a>`
          : `<span class="model-name" title="${name}">${name}</span>`;

        const group = model.group && model.group.name
          ? `<span class="model-group">${escapeHtml(model.group.name)}</span>`
          : "";

        const atRisk = model.tags && model.tags.at_risk === true;
        const unassessable = model.tags && model.tags.unassessable === true;
        const rowClass = unassessable ? "unassessable" : atRisk ? "at-risk" : "";

        const scoreVal = typeof model.score === "number" ? model.score.toFixed(1) : "?";
        const maxVal = Number.isFinite(maxScore) ? maxScore.toFixed(1) : "?";

        const coverageClass = unassessable ? "coverage unassessable" : "coverage";

        const detectorCells = detectors.map((d) => {
          const detector = model.detectors && model.detectors[d];
          if (!detector) {
            return `<td class="status-cell empty-cell">—</td>`;
          }
          return `<td class="status-cell">${renderStatusCell(detector.status)}</td>`;
        }).join("");

        return `
          <tr class="${rowClass}">
            <td class="model-cell">${nameCell}${group}</td>
            <td class="risk">risk=${scoreVal}/${maxVal}</td>
            <td>${renderSeverityBadge(model.severity)}</td>
            <td class="${coverageClass}">${escapeHtml((model.coverage && model.coverage.label) || "—")}</td>
            ${detectorCells}
          </tr>
        `;
      }).join("");

      return `
        <div class="matrix-wrap">
          <table role="table" aria-label="Model risk matrix">
            <thead>
              <tr>
                <th class="model-col" scope="col">Model</th>
                <th class="risk-col" scope="col">Risk</th>
                <th class="severity-col" scope="col">Severity</th>
                <th class="coverage-col" scope="col">Coverage</th>
                ${headerCols}
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="${4 + detectors.length}" class="empty-cell">No models in this run.</td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderLegend() {
      const run = currentRun;
      if (!run) return "";

      const statuses = Array.isArray(run.scoring && run.scoring.statuses) ? run.scoring.statuses : Object.keys(STATUS_CONFIG);
      const statusChips = statuses.map((s) => {
        const cfg = STATUS_CONFIG[s];
        if (!cfg) return "";
        return `<span class="chip ${cfg.class}"><span aria-hidden="true">${cfg.shape}</span>${escapeHtml(cfg.label)}</span>`;
      }).join("");

      const thresholds = run.scoring && run.scoring.severity_thresholds;
      let thresholdText = "";
      if (thresholds && typeof thresholds === "object") {
        const parts = [];
        if (typeof thresholds.HIGH === "number") parts.push(`HIGH ≥ ${thresholds.HIGH}`);
        if (typeof thresholds.MEDIUM === "number") parts.push(`MEDIUM ≥ ${thresholds.MEDIUM}`);
        if (parts.length) thresholdText = ` · thresholds: ${parts.join(", ")}`;
      }

      return `
        <div class="legend">
          <div class="legend-group">
            <span>Detector states:</span>
            ${statusChips}
          </div>
          <div class="legend-group">
            <span>Severity:${thresholdText}</span>
            <span class="chip severity-high">▲ HIGH</span>
            <span class="chip severity-medium">◆ MEDIUM</span>
            <span class="chip severity-low">● LOW</span>
          </div>
        </div>
      `;
    }

    function renderClockBanner() {
      const run = currentRun;
      if (!run || !run.run || !run.run.clock_overridden) return "";
      const assessed = formatDate(run.run.assessed_at);
      return `
        <div class="clock-banner" role="status">
          <span class="icon" aria-hidden="true">⏱</span>
          <span>This run's clock was overridden for testing — effective date: ${escapeHtml(assessed)}</span>
        </div>
      `;
    }

    function renderViewSwitcher() {
      const matrixClass = currentView === "matrix" ? "active" : "";
      const rankingClass = currentView === "ranking" ? "active" : "";
      return `
        <div class="view-switcher" role="tablist" aria-label="Dashboard view">
          <button type="button" role="tab" aria-selected="${currentView === "matrix"}" class="${matrixClass}" data-view="matrix">Matrix</button>
          <button type="button" role="tab" aria-selected="${currentView === "ranking"}" class="${rankingClass}" data-view="ranking">Ranking & Coverage</button>
        </div>
      `;
    }

    function renderHeader() {
      const run = currentRun;
      const assessed = run && run.run ? formatDate(run.run.assessed_at) : "—";
      const modelCount = run && Array.isArray(run.models) ? run.models.length : 0;
      const subtitle = currentView === "matrix"
        ? "Risk matrix · view 4.1"
        : "Ranking & coverage · view 4.2";

      return `
        <header>
          <div class="brand">
            <h1>deadreckon</h1>
            <span class="subtitle">${subtitle}</span>
          </div>
          <div class="meta">
            <span>${modelCount} model${modelCount === 1 ? "" : "s"} · ${assessed}</span>
            ${renderViewSwitcher()}
            <label class="file-loader">
              <input type="file" accept=".json,application/json" aria-label="Load run JSON file" />
              <span class="button">📁 Load run JSON</span>
            </label>
          </div>
        </header>
      `;
    }

    function renderUploadPrompt() {
      return `
        <div class="upload-prompt">
          <strong>Drag and drop a run JSON file here</strong>, or use the file picker above.
        </div>
      `;
    }

    function getModelCategory(model) {
      if (model.tags && model.tags.unassessable === true) return "unassessable";
      if (model.tags && model.tags.at_risk === true) return "at-risk";
      if (model.finding_count > 0) return "finding-not-at-risk";
      return "safe";
    }

    function renderRankingChart() {
      const run = currentRun;
      if (!run) return "";

      const models = run.models || [];
      const scoring = run.scoring || {};
      const maxScore = typeof scoring.max_possible_score === "number" && Number.isFinite(scoring.max_possible_score)
        ? scoring.max_possible_score
        : 3;

      const totalCoverage = models.length && models[0].coverage && typeof models[0].coverage.total === "number"
        ? models[0].coverage.total
        : 3;

      const width = 1100;
      const height = 620;
      const margin = { top: 40, right: 300, bottom: 70, left: 70 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;

      const xPad = plotW * 0.05;
      const yPad = plotH * 0.05;
      const x0 = margin.left + xPad;
      const x1 = margin.left + plotW - xPad;
      const y0 = margin.top + plotH - yPad;
      const y1 = margin.top + yPad;

      function xScale(score) {
        const t = maxScore > 0 ? Math.min(Math.max(score, 0) / maxScore, 1) : 0;
        return x0 + t * (x1 - x0);
      }

      function yScale(conclusive) {
        const t = totalCoverage > 0 ? Math.min(Math.max(conclusive, 0) / totalCoverage, 1) : 0;
        return y0 - t * (y0 - y1);
      }

      const xTicks = 5;
      let xAxisTicks = "";
      for (let i = 0; i <= xTicks; i++) {
        const value = (maxScore / xTicks) * i;
        const x = xScale(value);
        xAxisTicks += `
          <line class="axis-tick" x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + 6}" />
          <line class="grid-line" x1="${x}" y1="${y1}" x2="${x}" y2="${y0}" />
          <text class="axis-label" x="${x}" y="${y0 + 24}" text-anchor="middle">${value.toFixed(1)}</text>
        `;
      }

      let yAxisTicks = "";
      for (let i = 0; i <= totalCoverage; i++) {
        const y = yScale(i);
        yAxisTicks += `
          <line class="axis-tick" x1="${margin.left - 6}" y1="${y}" x2="${margin.left}" y2="${y}" />
          <line class="grid-line" x1="${margin.left}" y1="${y}" x2="${margin.left + plotW}" y2="${y}" />
          <text class="axis-label" x="${margin.left - 12}" y="${y + 4}" text-anchor="end">${i}/${totalCoverage}</text>
        `;
      }

      const zoneTop = yScale(0.5);
      const zoneLabelY = zoneTop + 18;
      const zoneLabelX = margin.left + plotW - 14;

      const LABEL_W = 240;
      const LABEL_H = 48;
      const LABEL_GAP = 8;

      const points = models.map((model, index) => {
        const score = typeof model.score === "number" ? model.score : 0;
        const conclusive = model.coverage && typeof model.coverage.conclusive === "number"
          ? model.coverage.conclusive
          : 0;
        const coverageLabel = (model.coverage && model.coverage.label) || `${conclusive}/${totalCoverage}`;
        const category = getModelCategory(model);

        const cx = xScale(score);
        const cy = yScale(conclusive);

        const name = escapeHtml(model.name || "Unnamed model");
        const scoreVal = score.toFixed(1);
        const maxVal = maxScore.toFixed(1);
        const riskText = `risk=${scoreVal}/${maxVal}`;
        const coverageClass = category === "unassessable" ? "label-coverage unassessable" : "label-coverage";

        const labelX = cx + 22;
        const labelAbove = index % 2 === 0;
        const labelY = labelAbove
          ? cy - LABEL_H - LABEL_GAP
          : cy + LABEL_GAP;

        let icon = "";
        if (category === "safe") icon = "✓";
        else if (category === "unassessable") icon = "?";
        else if (category === "at-risk") icon = "✕";
        else icon = "!";

        const leaderStartX = cx + 10;
        const leaderStartY = labelAbove ? cy - 10 : cy + 10;
        const leaderEndX = labelX - 6;
        const leaderEndY = labelAbove ? labelY + LABEL_H - 8 : labelY + 8;

        return `
          <g class="point" data-category="${category}">
            <circle class="point-marker ${category}" cx="${cx}" cy="${cy}" r="10" />
            <text class="point-icon ${category}" x="${cx}" y="${cy}" dominant-baseline="central">${icon}</text>
            <line class="leader-line" x1="${leaderStartX}" y1="${leaderStartY}" x2="${leaderEndX}" y2="${leaderEndY}" />
            <rect class="model-label-bg" x="${labelX - 6}" y="${labelY - 4}" width="${LABEL_W + 12}" height="${LABEL_H + 8}" />
            <foreignObject class="model-label" x="${labelX}" y="${labelY}" width="${LABEL_W}" height="${LABEL_H}">
              <div xmlns="http://www.w3.org/1999/xhtml">
                <div class="model-name-small" title="${name}">${name}</div>
                <div class="label-risk">${riskText} · <span class="${coverageClass}">${escapeHtml(coverageLabel)}</span></div>
              </div>
            </foreignObject>
          </g>
        `;
      }).join("");

      return `
        <div class="ranking-chart" role="img" aria-label="Risk versus coverage scatter plot">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
            <rect class="unverified-zone" x="${margin.left}" y="${zoneTop}" width="${plotW}" height="${y0 - zoneTop}" />

            ${xAxisTicks}
            ${yAxisTicks}

            <line class="axis-line" x1="${margin.left}" y1="${y0}" x2="${margin.left + plotW}" y2="${y0}" />
            <line class="axis-line" x1="${margin.left}" y1="${y0}" x2="${margin.left}" y2="${margin.top}" />

            <text class="axis-title" x="${margin.left + plotW / 2}" y="${height - 18}" text-anchor="middle">Risk score →</text>
            <text class="axis-title" x="${18}" y="${margin.top + plotH / 2}" text-anchor="middle" transform="rotate(-90, 18, ${margin.top + plotH / 2})">Coverage (conclusive detectors) →</text>

            ${points}

            <text class="zone-label" x="${zoneLabelX}" y="${zoneLabelY}" text-anchor="end">⚠ Unverified — not the same as safe</text>
          </svg>
        </div>
      `;
    }

    function renderRankingLegend() {
      return `
        <div class="ranking-legend">
          <span class="legend-item"><span class="legend-symbol safe" aria-hidden="true">✓</span> Fully checked, clean</span>
          <span class="legend-item"><span class="legend-symbol at-risk" aria-hidden="true">✕</span> At risk</span>
          <span class="legend-item"><span class="legend-symbol finding-not-at-risk" aria-hidden="true">!</span> Finding but not at risk</span>
          <span class="legend-item"><span class="legend-symbol unassessable" aria-hidden="true">?</span> Unassessable (0 checked)</span>
        </div>
      `;
    }

    function renderRanking() {
      const run = currentRun;
      if (!run) return "";

      return `
        <div class="ranking-wrap">
          ${renderRankingChart()}
          ${renderRankingLegend()}
        </div>
      `;
    }

    function renderMainContent() {
      if (currentView === "matrix") {
        return `${renderLegend()}${renderMatrix()}`;
      }
      return renderRanking();
    }

    function render() {
      if (!currentRun && !loadError) {
        app.innerHTML = `<div class="loading">Loading run data…</div>`;
        return;
      }

      if (loadError && !currentRun) {
        app.innerHTML = `
          ${renderHeader()}
          <div class="drop-zone">
            <div class="error">${loadError}</div>
            ${renderUploadPrompt()}
          </div>
        `;
        bindEvents();
        return;
      }

      app.innerHTML = `
        ${renderHeader()}
        <div class="drop-zone">
          ${renderClockBanner()}
          ${renderMainContent()}
          ${renderUploadPrompt()}
        </div>
      `;
      bindEvents();
    }

    function bindEvents() {
      const input = app.querySelector('input[type="file"]');
      if (input) {
        input.addEventListener("change", (e) => readFile(e.target.files[0]));
      }

      const buttons = app.querySelectorAll(".view-switcher button[data-view]");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => setView(btn.dataset.view));
      });

      const dropZone = app.querySelector(".drop-zone");
      if (dropZone) {
        ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
          dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
          }, false);
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          dropZone.addEventListener(eventName, () => dropZone.classList.add("drag-over"), false);
        });

        ["dragleave", "drop"].forEach((eventName) => {
          dropZone.addEventListener(eventName, () => dropZone.classList.remove("drag-over"), false);
        });

        dropZone.addEventListener("drop", (e) => {
          const file = e.dataTransfer.files[0];
          if (file) readFile(file);
        }, false);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      render();
      loadDefault();
    });
  </script>
</body>
</html>
