[project]
name = "deadreckon"
version = "0.1.0"
description = "Metadata-only agent that traces DataHub ML lineage and surfaces silent model risk"
requires-python = ">=3.10"
dependencies = [
    "acryl-datahub[datahub-rest,sqlalchemy]>=1.6.0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
